server:
  port: 8088
spring:
  jackson:
      # 配置全局字段命名策略：后端驼峰属性（如 imageName）→ 响应 JSON 下划线字段（如 image_name）
      property-naming-strategy: SNAKE_CASE
  application:
    name:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/mini_shop?useSSL=false&serverTimezone=UTC
    username: dev1
    password: 123456
  redis:
    host: 127.0.0.1
    port: 6379
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
    password: 123456

mybatis-plus:
  configuration:
    # 1. 枚举全局处理器（映射 IEnum 接口的 getValue() 或 ordinal()）
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
    # 2. 未知枚举值时不报错（返回 null，避免查询失败，3.5.0+ 支持）
    enum-automap-unknown-value: true
    # 优化：开启驼峰命名自动转换（数据库下划线 → Java 驼峰，如 user_name → userName）
    map-underscore-to-camel-case: true
    # 优化：打印 SQL（开发环境方便调试）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  # 3. 扫描自定义类型处理器
  type-handlers-package: com.autodl_backend.conf